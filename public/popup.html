<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneFocus 진행상황</title>
    <!-- Vite 빌드 산출물: Tailwind CSS (assetsDir: assets, assetFileNames: [name].[ext]) -->
    <!-- 실제 빌드 산출물명에 맞춤 -->
    <link rel="stylesheet" href="timerUtils.css" />
    <style>
      body {
        margin: 0;
        padding: 8px;
        box-sizing: border-box;
        width: 336px;
        height: 416px;
        min-width: 336px;
        min-height: 416px;
        background: transparent;
      }
      #popup-root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      (function () {
        try {
          var SETTINGS_KEY = 'onefocus_settings_v1';
          var theme = 'light';
          var language = 'en';

          if (typeof chrome !== 'undefined' && chrome.storage && chrome.runtime && chrome.runtime.id) {
            chrome.storage.local.get([SETTINGS_KEY], function (res) {
              try {
                var saved = res && res[SETTINGS_KEY];
                if (saved && saved.theme === 'dark') {
                  document.documentElement.classList.add('dark');
                }
                if (saved && saved.language) {
                  document.documentElement.setAttribute('lang', saved.language);
                  language = saved.language;
                }
                document.title = language && language.startsWith('ko') ? 'OneFocus 진행상황' : 'OneFocus Progress';
              } catch (e) {}
            });
          } else {
            var raw = localStorage.getItem(SETTINGS_KEY);
            if (raw) {
              var savedLocal = JSON.parse(raw);
              if (savedLocal && savedLocal.theme === 'dark') {
                document.documentElement.classList.add('dark');
              }
              if (savedLocal && savedLocal.language) {
                document.documentElement.setAttribute('lang', savedLocal.language);
                language = savedLocal.language;
              }
            }
            document.title = language && language.startsWith('ko') ? 'OneFocus 진행상황' : 'OneFocus Progress';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="popup-root"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
