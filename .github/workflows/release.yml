name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: One Focus ${{ github.ref_name }}
          body: |
            ## 🎯 One Focus ${{ github.ref_name }}

            ### ✨ Features
            - Pomodoro timer with real-time progress
            - Task management with drag & drop
            - Motivational quotes
            - Multi-language support
            - Chrome extension integration

            ### 📦 Installation
            Download from [Chrome Web Store](https://chromewebstore.google.com/detail/one-focus/dgehmnblaocgaioijfigmbhkpbjdobaf)

            ### ��️ Technical Details
            - React 18 + TypeScript
            - Chrome Extension Manifest V3
            - Zustand state management
            - Tailwind CSS styling
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist.zip
          asset_name: one-focus-${{ github.ref_name }}.zip
          asset_content_type: application/zip
